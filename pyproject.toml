[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aris"
version = "0.1.0"
description = "Aris: production-grade Mixture-of-Experts decoder-only LLM framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ignisg20" }]
keywords = ["llm", "transformer", "moe", "rlhf", "rope", "flash-attention"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "prometheus-client>=0.20",
    "tiktoken>=0.6",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "rich>=13.7",
    "datasets>=2.18",
    "psutil>=5.9",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.5.0"]
train = [
    "deepspeed>=0.14",
    "accelerate>=0.30",
    "wandb>=0.16",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.4",
]
nvml = ["pynvml>=11.5"]

[project.scripts]
aris-serve = "llm.api.server:main"
aris-train = "llm.training.pretrain:main"
aris-finetune = "llm.alignment.sft:main"

[tool.setuptools.packages.find]
include = ["llm*"]
exclude = ["tests*", "docs*", "deploy*", "scripts*"]

[tool.setuptools.package-data]
"llm.api" = ["web/*.html", "web/*.js", "web/*.css"]
"llm.configs" = ["*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4"]
ignore = ["E501", "B008", "N812", "N806", "N803"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
