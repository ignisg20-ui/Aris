# Aris-200B: sparse MoE. ~200B total params, ~28B activated per token.
name: aris-200b-moe
vocab_size: 128256
hidden_size: 8192
intermediate_size: 2048    # smaller per-expert FFN; activated ~28B/tok
num_layers: 64
max_position_embeddings: 131072
norm_eps: 1.0e-5
dtype: bf16
attention:
  num_heads: 64
  num_kv_heads: 8
  attention_impl: sdpa
  mla_q_lora_rank: 1536
  mla_kv_lora_rank: 512
  mla_qk_rope_head_dim: 64
  mla_qk_nope_head_dim: 128
  mla_v_head_dim: 128
rope:
  rope_theta: 1000000.0
  rope_scaling_type: yarn
  rope_scaling_factor: 4.0
  rope_original_max_position: 32768
moe:
  num_experts: 64
  num_experts_per_token: 8
  router_type: topk
  capacity_factor: 1.25
  router_z_loss_coef: 1.0e-3
  load_balance_loss_coef: 1.0e-2
  moe_layer_freq: 1
  shared_expert: true
  shared_expert_intermediate_size: 2048
