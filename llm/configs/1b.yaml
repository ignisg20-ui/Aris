# Aris-1B: dense, single-node friendly. Approx 1.2B params.
name: aris-1b
vocab_size: 128256
hidden_size: 2048
intermediate_size: 5632
num_layers: 22
max_position_embeddings: 8192
norm_eps: 1.0e-5
tie_word_embeddings: true
dtype: bf16
attention:
  num_heads: 16
  num_kv_heads: 4
  attention_impl: sdpa
  use_qk_norm: true
rope:
  rope_theta: 500000.0
moe:
  num_experts: 1
