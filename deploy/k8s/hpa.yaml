apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aris-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aris-inference
  minReplicas: 2
  maxReplicas: 32
  metrics:
    - type: Pods
      pods:
        metric:
          name: aris_tokens_per_second
        target:
          type: AverageValue
          averageValue: "1500"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 10, periodSeconds: 60 }
